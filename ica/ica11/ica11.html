<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ICA11 · A Silly Story</title>
    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <h1>A Silly Story</h1>
    <!--
      Starter markup from MDN's Silly story generator:
      https://developer.mozilla.org/en-US/docs/Learn/JavaScript/First_steps/Silly_story_generator
      Structure only. MDN's JavaScript is not included.
    -->
    <div>
      <label for="custom-name">Enter custom name:</label>
      <input id="custom-name" type="text" placeholder="" />
    </div>
    <fieldset>
      <legend>Choose locale:</legend>
      <label for="us">US</label>
      <input id="us" type="radio" name="uk-us" value="us" checked />
      <label for="uk">UK</label>
      <input id="uk" type="radio" name="uk-us" value="uk" />
    </fieldset>
    <div>
      <button class="generate" type="button">Generate random story</button>
    </div>
    <!-- Thanks a lot to Willy Aguirre for his help with the code for this assessment -->
    <p class="story"></p>
  </body>
</html>
